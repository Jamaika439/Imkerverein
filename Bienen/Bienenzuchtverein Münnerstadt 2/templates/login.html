{% extends 'base.html' %}
{% block content %}
    <h2>Admin Login</h2>
    <form method="POST" style="display: flex; flex-direction: column; gap: 10px; max-width: 300px;">
        <label>Passwort eingeben:</label>
        <input type="password" name="pw" placeholder="Passwort" required style="padding: 8px;">
<button type="submit" style="background: #2C1E12; color: #FFB300; border: 1px solid #FFB300; padding: 12px 30px; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.2s;">
    Anmelden
</button>    </form>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
{% endblock %}
