{% extends 'base.html' %}

{% block content %}
<div class="bienen-page-container">
    <div class="bienen-hero">
        <h1>Termine</h1>
        <div class="hero-line"></div>
    </div>

    <!-- Hier der Kalender-Container -->
    <div style="width: 100%; height: 700px; border: var(--sharp-border);">
        <!-- Das 'c' kommt aus der app.py: c=Content.query.filter_by(seite='termine').first() -->
        <iframe src="{{ c.text if c else '' }}" 
                style="width: 100%; height: 100%; border: none;">
        </iframe>
    </div>
</div>
{% endblock %}
